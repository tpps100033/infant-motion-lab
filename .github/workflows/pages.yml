name: Publish Motion Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test joint judgement rate and confidence selection
        run: node --test tests/*.test.mjs
      - name: Test private database permissions and encrypted storage
        run: |
          python -m pip install -r server/requirements.txt pytest httpx
          python -m pytest tests/test_private_api.py -q
      - name: Prepare browser runtime and verify RTMPose weights
        run: python scripts/prepare_web.py
      - name: Check static files and model integrity
        run: python scripts/check_static.py
      - name: Package static website
        run: python scripts/package_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for the uploaded artifact to be discoverable
        run: python scripts/wait_for_artifact.py
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
      - name: Deploy GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact service propagation after a failed attempt
        if: steps.deployment.outcome == 'failure'
        run: python -c "import time; time.sleep(20)"
      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
